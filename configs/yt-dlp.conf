# METADATA
--write-info-json
--write-description
--write-comments
--write-thumbnail
--write-link

# SUBTITLES
--sub-langs en,ja
--write-subs
--write-auto-subs

# VIDEOS
--remux-video mkv
--keep-video

# AUDIOS
--audio-quality 0
--no-audio-multistreams

# PLAYLISTS
--write-playlist-metafiles
--playlist-reverse

# EMBEDS
--embed-metadata
--embed-info-json
--embed-thumbnail
--embed-subs
--embed-chapters

# DOWNLOADS
--concurrent-fragments 50
--retries 20
--fragment-retries 20
--file-access-retries 20
--no-progress

# FILES
--paths "../downloads/archives"
--cookies "../utilities/cookies.txt"
--output "%(id)s/%(id)s.%(ext)s"
--download-archive "../downloads/archives/index.log"

# PREPROCESSES
--exec pre_process:"if not exist ..\downloads\archives\%(id)q mkdir ..\downloads\archives\%(id)q"
--exec pre_process:"if not exist ..\downloads\archives\%(channel_id)q mkdir ..\downloads\archives\%(channel_id)q"
--exec pre_process:"start /b uv run yt-dlp --sub-langs live_chat --write-subs --skip-download %(original_url)q"

# POSTPROCESSES
--exec post_process:"uv run yt-dlp https://www.youtube.com/channel/%(channel_id)q --write-thumbnail -I 0 -f 17"
--exec post_process:"if exist *[*].jpg move /y *[*].jpg ..\downloads\archives\%(channel_id)q\profile.jpg >nul 2>&1"
--exec post_process:"if exist *chat.json move /y *chat.json ..\downloads\archives\%(id)q\%(id)q.chat.json >nul 2>&1"
